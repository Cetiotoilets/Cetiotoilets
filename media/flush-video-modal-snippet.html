<!--
========================================================================
 CETIO — Flush System Video Modal (copy/paste snippet)
========================================================================

WHY THE VIDEO WAS BROKEN:
  /media/flush-system.mp4 in the project is only 2 bytes — an empty
  placeholder, not an actual video. That's why clicking the link opens
  a blank/black native browser player stuck at 0:00. This snippet does
  NOT fix that on its own — you must also replace media/flush-system.mp4
  with the real video file (same filename, same path) and redeploy.

WHAT THIS SNIPPET DOES:
  Replaces the plain "open raw .mp4 in a new tab" link with a proper
  in-page video modal that matches the site's existing warm
  black / espresso / cream design system (uses the same CSS variables
  already defined in your pages: --ink, --espresso, --taupe, --cream,
  --font-display, --ease, etc).

HOW TO INSTALL (do this on EACH of these 4 pages):
  pure-one/index.html
  pure-one-plus/index.html
  pure-pro/index.html
  pure-smart/index.html

  STEP 1 — Paste the <style> block below into the page's existing
           <style> section (anywhere inside it is fine).

  STEP 2 — Find this existing line on the page (it's the same on all
           4 pages, just the href for the PDFs differs):

             <a class="doc-link" href="/media/flush-system.mp4"
                target="_blank" rel="noopener" data-cursor="Play Video">
                <span class="ic">V</span> Flush System Video</a>

           Replace ONLY that <a> tag with the "REPLACEMENT LINK" block
           below (keep the two doc-link PDF links before it untouched).

  STEP 3 — Paste the "MODAL MARKUP" block right before the closing
           </body> tag (once per page).

  STEP 4 — Paste the <script> block below right before the closing
           </body> tag too, after the modal markup.

  STEP 5 — Make sure the real (non-empty) flush-system.mp4 is at
           /media/flush-system.mp4 on the server. Optionally add a
           poster image at /media/flush-system-poster.jpg (see the
           poster="" attribute in the modal markup — remove that
           attribute if you don't have a poster image).
========================================================================
-->


<!-- ============ 1) STYLE — paste inside your existing <style> tag ============ -->
<style>
/* Flush System Video Modal */
.video-modal-overlay{
  position:fixed; inset:0; z-index:9999;
  background:rgba(13,13,13,.86);
  display:flex; align-items:center; justify-content:center;
  padding:32px;
  opacity:0; visibility:hidden;
  transition:opacity .35s var(--ease), visibility .35s var(--ease);
}
.video-modal-overlay.is-open{ opacity:1; visibility:visible; }

.video-modal{
  position:relative;
  width:100%; max-width:960px;
  background:var(--espresso);
  border:1px solid var(--taupe-dim);
  border-radius:4px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  transform:translateY(24px) scale(.98);
  transition:transform .35s var(--ease);
}
.video-modal-overlay.is-open .video-modal{ transform:translateY(0) scale(1); }

.video-modal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 24px;
  border-bottom:1px solid var(--taupe-dim);
}
.video-modal-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:20px;
  letter-spacing:.02em;
  color:var(--cream);
  margin:0;
}
.video-modal-close{
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--taupe-dim);
  border-radius:50%;
  color:var(--taupe-light);
  font-size:18px;
  line-height:1;
  transition:border-color .25s var(--ease), color .25s var(--ease), background .25s var(--ease);
}
.video-modal-close:hover{
  color:var(--ink);
  background:var(--taupe-light);
  border-color:var(--taupe-light);
}

.video-modal-body{
  padding:0;
  background:#000;
}
.video-modal-body video{
  width:100%;
  max-height:70vh;
  display:block;
}

.video-modal-footer{
  padding:14px 24px 20px;
  color:var(--sand-2);
  font-family:var(--font-body);
  font-size:15px;
  font-style:italic;
}

@media (max-width:640px){
  .video-modal-overlay{ padding:14px; }
  .video-modal-header{ padding:14px 16px; }
  .video-modal-title{ font-size:17px; }
  .video-modal-footer{ padding:12px 16px 16px; font-size:14px; }
}
</style>


<!-- ============ 2) REPLACEMENT LINK — swap in for the old <a href="/media/flush-system.mp4"> ============ -->
<a class="doc-link" href="#" data-cursor="Play Video" onclick="openFlushVideoModal(event)">
  <span class="ic">V</span> Flush System Video
</a>


<!-- ============ 3) MODAL MARKUP — paste once before </body> ============ -->
<div class="video-modal-overlay" id="flushVideoModal" aria-hidden="true">
  <div class="video-modal" role="dialog" aria-modal="true" aria-labelledby="flushVideoTitle">
    <div class="video-modal-header">
      <p class="video-modal-title" id="flushVideoTitle">Flush System Video</p>
      <button class="video-modal-close" onclick="closeFlushVideoModal()" aria-label="Close video">&#10005;</button>
    </div>
    <div class="video-modal-body">
      <video id="flushVideoPlayer" controls preload="none" poster="/media/flush-system-poster.jpg">
        <source src="/media/flush-system.mp4" type="video/mp4">
        Your browser doesn't support embedded video.
        <a href="/media/flush-system.mp4">Download the video instead.</a>
      </video>
    </div>
    <div class="video-modal-footer">
      Kirin pressure-assist flush cycle, shown in full.
    </div>
  </div>
</div>


<!-- ============ 4) SCRIPT — paste once before </body>, after the modal markup ============ -->
<script>
function openFlushVideoModal(e){
  if(e) e.preventDefault();
  var overlay = document.getElementById('flushVideoModal');
  var video = document.getElementById('flushVideoPlayer');
  overlay.classList.add('is-open');
  overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  if(video){ video.load(); video.play().catch(function(){}); }
}
function closeFlushVideoModal(){
  var overlay = document.getElementById('flushVideoModal');
  var video = document.getElementById('flushVideoPlayer');
  overlay.classList.remove('is-open');
  overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if(video){ video.pause(); }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeFlushVideoModal();
});
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'flushVideoModal') closeFlushVideoModal();
});
</script>
